name: API Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Start Flask Application in Background
        run: |
          python app.py &
          sleep 3

      - name: Install Node & Newman
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman Reporters
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman Test Suite
        run: |
          newman run collection.json -r cli,htmlextra --reporter-htmlextra-export test-report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: test-report.html
