info:
  name: Flask User Management API Suite
  schema: "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
item:
  - name: "1. Health Check"
    event:
      - listen: test
        script:
          type: text/javascript
          exec:
            - "pm.test('Status code is 200', function () { pm.response.to.have.status(200); });"
    request:
      method: GET
      url: "http://web-api:5000/health"
  - name: "2. Get All Users (Initial)"
    event:
      - listen: test
        script:
          type: text/javascript
          exec:
            - "pm.test('Status code is 200', function () { pm.response.to.have.status(200); });"
    request:
      method: GET
      url: "http://web-api:5000/users"
  - name: "3. Create New User"
    event:
      - listen: test
        script:
          type: text/javascript
          exec:
            - "pm.test('Status code is 201 Created', function () { pm.response.to.have.status(201); });"
    request:
      method: POST
      header:
        - key: Content-Type
          value: application/json
      body:
        mode: raw
        raw: "{\n  \"name\": \"Suresh\",\n  \"role\": \"Cloud Engineer\"\n}"
      url: "http://web-api:5000/users"
  - name: "4. Get Single User (User 1)"
    event:
      - listen: test
        script:
          type: text/javascript
          exec:
            - "pm.test('Status code is 200', function () { pm.response.to.have.status(200); });"
    request:
      method: GET
      url: "http://web-api:5000/users/1"
